name: Release

# Push a tag that matches the version in manifest.json, without a "v" prefix:
#   git tag -a 0.1.0 -m "0.1.0" && git push origin 0.1.0
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Create zip for manual install
        run: |
          id="$(node -p "require('./manifest.json').id")"
          mkdir -p "dist/$id"
          cp main.js manifest.json styles.css "dist/$id/"
          (cd dist && zip -r "../$id-${GITHUB_REF_NAME}.zip" "$id")

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="$(node -p "require('./manifest.json').id")"
          gh release create "$GITHUB_REF_NAME" \
            --title="$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css "$id-${GITHUB_REF_NAME}.zip"
